# This config should be put in /etc/greetd/

[terminal]
# The VT to run the greeter on. Can be "next", "current" or a number
# designating the VT.
vt = 2

# The default session, also known as the greeter.
[default_session]
# command = "agreety --cmd /bin/sh"

command = "tuigreet --cmd /usr/local/bin/session-sel -g 'coffee makes theorems' --time --asterisks"
# command = "tuigreet --cmd startx -g 'coffee makes theorems' --time --asterisks"
# session-sel (usr/local/bin) runs after login: [enter] Chao Phraya WM (default),
# [s] sway, [$] sh. The start-* scripts set up the session environment.

user = "greeter"
